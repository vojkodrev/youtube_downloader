user www-data;
worker_processes 1;

error_log  nginx/nginx.log;
pid        nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    nginx/nginx.log;
    client_body_temp_path  nginx/temp/client_body;
    proxy_temp_path        nginx/temp/proxy;
    fastcgi_temp_path      nginx/temp/fastcgi;
    uwsgi_temp_path        nginx/temp/uwsgi;
    scgi_temp_path         nginx/temp/scgi;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    server {
        listen 80;
        root dist;
        index index.html;

        # Cache hashed assets forever (Vite appends content hash to filenames)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
